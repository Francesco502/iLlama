name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        default: "v3.1.0"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release artifact
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm test
          npm run build

      - name: Verify Rust
        working-directory: src-tauri
        run: |
          cargo test
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build unsigned macOS bundle
        run: npm run tauri:build

      - name: Generate checksum
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          shasum -a 256 "src-tauri/target/release/bundle/dmg/iLlama_${VERSION}_aarch64.dmg" \
            > "src-tauri/target/release/bundle/dmg/iLlama_${VERSION}_aarch64.dmg.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/dmg/iLlama_*_aarch64.dmg
            src-tauri/target/release/bundle/dmg/iLlama_*_aarch64.dmg.sha256
