name: Release 3.2.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact release tag"
        required: true
        type: choice
        options:
          - v3.2.0-rc.1
          - v3.2.0
      ci_run_id:
        description: "Successful CI workflow run ID for the exact tagged SHA"
        required: true
        type: string
      llama_matrix_run_id:
        description: "Protected acceptance workflow run ID for the real GGUF matrix"
        required: true
        type: string
      external_client_run_id:
        description: "Protected acceptance workflow run ID for the curl client"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-dispatch-ref:
    name: Validate release dispatch ref
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected tag as the workflow ref
        shell: bash
        env:
          ACTUAL_REF: ${{ github.ref }}
          EXPECTED_REF: refs/tags/${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$ACTUAL_REF" == "$EXPECTED_REF" ]]

  github-release:
    name: Build and publish unsigned Apple Silicon DMG
    if: github.ref == format('refs/tags/{0}', inputs.tag)
    needs: validate-dispatch-ref
    runs-on: macos-15
    environment: macos-release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      LLAMA_MATRIX_RUN_ID: ${{ inputs.llama_matrix_run_id }}
      EXTERNAL_CLIENT_RUN_ID: ${{ inputs.external_client_run_id }}
      GH_TOKEN: ${{ github.token }}
      ILLAMA_UNSIGNED_RELEASE: "1"

    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag, version, architecture, and external-server policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v3.2.0-rc.1" || "$RELEASE_TAG" == "v3.2.0" ]]
          [[ "$(git describe --tags --exact-match HEAD)" == "$RELEASE_TAG" ]]
          [[ "$(node -p 'require("./package.json").version')" == "3.2.0" ]]
          [[ "$(uname -m)" == "arm64" ]]
          test -f docs/releases/v3.2.0.md
          test -z "$(find src-tauri/binaries -type f ! -name .gitkeep -print -quit 2>/dev/null)"
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$LLAMA_MATRIX_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXTERNAL_CLIENT_RUN_ID" =~ ^[0-9]+$ ]]
          echo "TAGGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify CI and real-model evidence for the tagged SHA
        shell: bash
        run: |
          set -euo pipefail
          validate_run() {
            local run_id="$1" expected_path="$2" expected_event="$3" expected_head_branch="$4"
            local run_json="$RUNNER_TEMP/workflow-run-${run_id}.json"
            local attempt_file="$RUNNER_TEMP/workflow-run-${run_id}.attempt"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_json" || return 1
            node scripts/validate-workflow-run.mjs \
              --run-json "$run_json" \
              --attempt-output "$attempt_file" \
              --run-id "$run_id" \
              --head-sha "$TAGGED_SHA" \
              --workflow-path "$expected_path" \
              --repository "$GITHUB_REPOSITORY" \
              --head-branch "$expected_head_branch" \
              --event "$expected_event" || return 1
            IFS= read -r VERIFIED_RUN_ATTEMPT < "$attempt_file" || return 1
            [[ "$VERIFIED_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || return 1
          }
          verify_evidence() {
            local type="$1" run_id="$2"
            validate_run \
              "$run_id" ".github/workflows/release-acceptance.yml" workflow_dispatch "$RELEASE_TAG" || return 1
            local attempt="$VERIFIED_RUN_ATTEMPT"
            local artifact="evidence-${type}-${TAGGED_SHA}-${run_id}-${attempt}"
            local directory="$RUNNER_TEMP/evidence/$type"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$directory" || return 1
            local report
            if [[ "$type" == "llama-matrix" ]]; then
              report="$directory/matrix-report.json"
            elif [[ "$type" == "external-client" ]]; then
              report="$directory/external-client-report.json"
            else
              return 1
            fi
            set -- node scripts/validate-release-evidence.mjs \
              --evidence "$directory/evidence.json" \
              --type "$type" \
              --report "$report" \
              --head-sha "$TAGGED_SHA" \
              --workflow-path ".github/workflows/release-acceptance.yml" \
              --run-id "$run_id" \
              --run-attempt "$attempt" \
              --repository "$GITHUB_REPOSITORY"
            if [[ "$type" == "external-client" ]]; then
              set -- "$@" --artifact "nativeReport=$directory/native-report.json"
            fi
            "$@" || return 1
          }
          validate_run "$CI_RUN_ID" ".github/workflows/ci.yml" push "$RELEASE_TAG"
          verify_evidence llama-matrix "$LLAMA_MATRIX_RUN_ID"
          verify_evidence external-client "$EXTERNAL_CLIENT_RUN_ID"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Install pinned prebuilt cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Verify release policy and dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-workflow.mjs
          npm run test:release-policy
          npm run test:release-evidence
          npm run check:project
          npm run test:tauri -- --surface deep-runner
          npm audit --audit-level=high
          npm audit --omit=dev
          cargo audit --json --file src-tauri/Cargo.lock > "$RUNNER_TEMP/cargo-audit.json"
          node scripts/verify-project-policy.mjs --audit "$RUNNER_TEMP/cargo-audit.json"

      - name: Build ad-hoc signed, unnotarized DMG
        run: npm run release:macos

      - name: Verify checksum, mount DMG, and launch the packaged app
        shell: bash
        run: |
          set -euo pipefail
          DMG="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg"
          CHECKSUM="$DMG.sha256"
          test -f "$DMG"
          node scripts/lib/portable-checksum.mjs verify "$CHECKSUM"

          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/illama-release-mount.XXXXXX")"
          MOUNT_POINT="$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$MOUNT_POINT")"
          ATTACH_PLIST="$RUNNER_TEMP/hdiutil-attach.plist"
          cleanup() {
            if [[ -n "${APP_PID:-}" ]]; then
              kill "$APP_PID" 2>/dev/null || true
            fi
            if [[ -n "${MOUNT_DEVICE:-}" ]]; then
              hdiutil detach "$MOUNT_DEVICE" >/dev/null 2>&1 || true
            fi
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_POINT" -plist > "$ATTACH_PLIST"
          MOUNT_DEVICE="$(
            plutil -convert json -o - "$ATTACH_PLIST" |
              jq -r --arg mount "$MOUNT_POINT" \
                '."system-entities"[] | select(."mount-point" == $mount) | ."dev-entry"' |
              head -n 1
          )"
          [[ "$MOUNT_DEVICE" == /dev/* ]]
          APP_COUNT="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' | wc -l | tr -d ' ')"
          [[ "$APP_COUNT" == "1" ]]
          APP_PATH="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          APP_EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          [[ "$APP_EXECUTABLE_NAME" != */* && -n "$APP_EXECUTABLE_NAME" ]]
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/$APP_EXECUTABLE_NAME"
          test -x "$APP_EXECUTABLE"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")" == "11.0" ]]
          lipo -archs "$APP_EXECUTABLE" | grep -qw arm64
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2> "$RUNNER_TEMP/codesign-details.txt"
          grep -Fx "Signature=adhoc" "$RUNNER_TEMP/codesign-details.txt"
          if grep -q "Authority=Developer ID Application:" "$RUNNER_TEMP/codesign-details.txt"; then
            echo "::error::Unsigned GitHub DMG unexpectedly contains a Developer ID signature"
            exit 1
          fi

          open -n "$APP_PATH"
          for _ in {1..20}; do
            APP_PID="$(pgrep -f "$APP_EXECUTABLE" | head -n 1 || true)"
            [[ -n "$APP_PID" ]] && break
            sleep 1
          done
          [[ "$APP_PID" =~ ^[0-9]+$ ]]
          kill "$APP_PID"
          APP_PID=""

      - name: Upload run-bound DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-release-dmg-${{ env.TAGGED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg
            src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg.sha256

      - name: Publish release candidate
        if: inputs.tag == 'v3.2.0-rc.1'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v3.2.0-rc.1
          name: iLlama 3.2.0 RC 1
          body_path: docs/releases/v3.2.0.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg
            src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg.sha256

      - name: Publish final release
        if: inputs.tag == 'v3.2.0'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v3.2.0
          name: iLlama 3.2.0
          body_path: docs/releases/v3.2.0.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg
            src-tauri/target/release/bundle/dmg/iLlama_3.2.0_aarch64.dmg.sha256
